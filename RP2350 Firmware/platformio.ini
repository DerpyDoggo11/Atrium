

[platformio]
default_envs = main
boards_dir = boards

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = gnss_rp2350
framework = arduino
board_build.core = earlephilhower

board_build.filesystem_size = 1m

monitor_speed = 115200
build_flags =
    -DUSB_MANUFACTURER='"YourName"'
    -DUSB_PRODUCT='"GNSS FC"'
    -DPICO_XOSC_STARTUP_DELAY_MULTIPLIER=64
    -O2


[env:main]
; MAIN ROVER (default): GNSS + RTK + 2nd-GPS averaging + pathfinding + motors.

[env:client]
; CLIENT PiSat: a 2nd GNSS only (no motors). Streams its position as $GP2 to the
; main rover (via its ESP32-C3) so the rover averages the two fixes.
build_flags = ${env.build_flags} -DPISAT_CLIENT=1

[env:base]
; BASE role: position-domain differential. Surveys a reference and streams $PSDG
; corrections out to an ESP32-C3 super mini for WiFi broadcast.
build_flags = ${env.build_flags} -DPISAT_BASE=1

[env:main_debug]
build_flags = ${env.build_flags} -g -Og
build_type = debug
upload_protocol = cmsis-dap
debug_tool = cmsis-dap
